name: Deploy Backend

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy API on EC2
        run: |
          ssh ubuntu@${{ secrets.EC2_HOST }} '
            set -e
            cd /app/finpulse/backend
            git fetch origin main
            git reset --hard FETCH_HEAD
            cd /app/finpulse
            docker compose -f backend/docker-compose.prod.yml --env-file .env up --build -d api
            docker image prune -f
          '
